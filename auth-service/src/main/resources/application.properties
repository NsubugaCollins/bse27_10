# Server configuration
server.port=${PORT:8082}

# Database Configuration (PostgreSQL) — shared DB with factory orchestrator
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DBNAME:frexsos}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:frex_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:frex_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=${JWT_SECRET:407f349713b7d781577174e9e03d3bc01b7a69b76c8c6f1406bb1b43932bcf0a}
jwt.expiration=86400000

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.frexsos.auth=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
