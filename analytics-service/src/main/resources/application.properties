# Server configuration
server.port=${PORT:8084}

# Database Configuration (PostgreSQL) — shared DB, read-only analytics
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DBNAME:frexsos}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:frex_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:frex_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — analytics service never modifies schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# JWT (shared secret with auth-service)
jwt.secret=${JWT_SECRET:407f349713b7d781577174e9e03d3bc01b7a69b76c8c6f1406bb1b43932bcf0a}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.frexsos.analytics=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
