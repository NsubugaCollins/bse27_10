version: '3.9'

# ---------------------------------------------------------------------------
# FREX-SOS — Production Docker Compose (5-Microservice Architecture)
# ---------------------------------------------------------------------------
# Services:
#   db                  — PostgreSQL 16
#   simulation          — Python/FastAPI ML & RAG engine      :8000
#   factory-orchestrator — Spring Boot API gateway/orchestrator :8081
#   auth-service        — Standalone JWT auth                 :8082
#   factory-service     — Factory/Machine/Robot management    :8083
#   analytics-service   — Analytics & reporting               :8084
#   frontend            — React/Nginx SPA                     :80
# ---------------------------------------------------------------------------

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: frex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frexsos}
      POSTGRES_USER: ${POSTGRES_USER:-frex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-frex} -d ${POSTGRES_DB:-frexsos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frex_net

  # ── Python Simulation & ML Engine ─────────────────────────────────────────
  simulation:
    build:
      context: ./simulation
      dockerfile: Dockerfile
    container_name: frex_simulation
    restart: unless-stopped
    environment:
      SIMULATION_API_KEY: ${SIMULATION_API_KEY:?SIMULATION_API_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - simulation_models:/app/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - frex_net

  # ── Spring Boot Factory Orchestrator ───────────────────────────────────────
  factory-orchestrator:
    build:
      context: ./factory-orchestrator
      dockerfile: Dockerfile
    container_name: frex_factory_orchestrator
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frexsos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-frex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:8082
      FACTORY_SERVICE_URL: http://factory-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
      SIMULATION_SERVICE_URL: http://simulation:8000
      SIMULATION_API_KEY: ${SIMULATION_API_KEY:?SIMULATION_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
      simulation:
        condition: service_started
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frex_net

  # ── Auth Microservice ──────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: frex_auth
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frexsos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-frex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frex_net

  # ── Factory Microservice ───────────────────────────────────────────────────
  factory-service:
    build:
      context: ./factory-service
      dockerfile: Dockerfile
    container_name: frex_factory
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frexsos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-frex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frex_net

  # ── Analytics Microservice ─────────────────────────────────────────────────
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: frex_analytics
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frexsos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-frex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
      simulation:
        condition: service_started
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frex_net

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api}
    container_name: frex_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      factory-orchestrator:
        condition: service_healthy
    networks:
      - frex_net

volumes:
  postgres_data:
  simulation_models:

networks:
  frex_net:
    driver: bridge
